name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Lint (optional)
        run: echo "Add ESLint command here if needed"

      - name: Test (optional)
        run: echo "Add test command here if needed"

      - name: Build Docker Image
        run: docker build -t car-rentals-app .

      # You can add deployment steps to Render / Heroku / AWS etc.
